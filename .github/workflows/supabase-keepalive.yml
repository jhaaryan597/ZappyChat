name: Supabase Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project URL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret is not set."
            exit 1
          fi

          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out "%{http_code}" "$SUPABASE_URL")
          if [ "$status" -lt 200 ] || [ "$status" -ge 500 ]; then
            echo "Unexpected status code: $status"
            exit 1
          fi